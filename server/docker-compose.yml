x-backend: &backend
  build:
    context: .
    target: backend
  environment: &backend-env
    DB_HOST: db
    DB_PORT: "5432"
    SECRET_KEY: ${SECRET_KEY:-local-development-only}
  depends_on:
    init:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: price_tracker
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d price_tracker"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  init:
    <<: *backend
    depends_on:
      db:
        condition: service_healthy
    command: python create_db.py
    restart: "no"
  api:
    <<: *backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
  scheduler:
    <<: *backend
    command: python -m app.queue scheduler
  ozon-worker:
    <<: *backend
    build:
      context: .
      target: ozon
    command: python -m app.queue ozon-worker
    environment:
      <<: *backend-env
      OZON_PROFILE_DIR: /profiles
      OZON_PROFILE_COUNT: ${OZON_PROFILE_COUNT:-1}
      OZON_PROFILE_SLOT: ${OZON_PROFILE_SLOT:-}
    volumes:
      - ./ozon-profiles:/profiles
    init: true
    shm_size: 512mb
  web:
    build: ../web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
